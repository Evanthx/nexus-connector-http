version: "2"

formatters:
  enable:
    - gci
    - goimports

linters:
  default: none
  enable:
    - errcheck
    - importas
    - revive
    - staticcheck
    - govet
    - forbidigo
    - exhaustive
    - godox
    - testifylint
  settings:
    staticcheck:
      checks:
        - "all"
        - "-ST1000" # disable: package comment is missing
    godox:
      keywords:
        - FIXME
    govet:
      disable:
        - fieldalignment
    forbidigo:
      forbid:
        - pattern: time.Sleep
          msg: "Please use require.Eventually or assert.Eventually instead unless you've no other option"
        - pattern: "^panic$"
          msg: "Please avoid using panic in application code"
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      severity: error
      confidence: 0.8
      enable-all-rules: true
      rules:
        # Disabled rules
        - name: add-constant
          disabled: true
        - name: argument-limit
          disabled: true
        - name: bare-return
          disabled: true
        - name: banned-characters
          disabled: true
        - name: bool-literal-in-expr
          disabled: true
        - name: confusing-naming
          disabled: true
        - name: empty-lines
          disabled: true
        - name: error-naming
          disabled: true
        - name: errorf
          disabled: true
        - name: exported
          disabled: true
        - name: file-header
          disabled: true
        - name: function-length
          disabled: true
        - name: imports-blocklist
          disabled: true
        - name: increment-decrement
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: nested-structs
          disabled: true
        - name: package-comments
          disabled: true
        - name: string-format
          disabled: true
        - name: unexported-naming
          disabled: true
        - name: unexported-return
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: unused-receiver
          disabled: true
        - name: use-any
          disabled: true
        - name: var-naming
          disabled: true
        - name: empty-block
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: unnecessary-stmt
          disabled: true
        - name: range-val-in-closure
          disabled: true

        # Rule tuning
        - name: cognitive-complexity
          arguments:
            - 25
        - name: cyclomatic
          arguments:
            - 25
        - name: function-result-limit
          arguments:
            - 5
        - name: unhandled-error
          arguments:
            - "fmt.*"
            - "bytes.Buffer.*"
            - "strings.Builder.*"
  exclusions:
    paths:
      - ^generated
      - ^.git
    rules:
      - path-except: _test\.go
        text: "time.Sleep"
        linters:
          - forbidigo
      - path: _test\.go
        text: "panic"
        linters:
          - forbidigo
      - path: _test\.go
        text: "(cyclomatic|cognitive)"
        linters:
          - revive
      - path: _test\.go
        text: "(dot-imports|unchecked-type-assertion)"
        linters:
          - revive

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m

output:
  sort-order:
    - file
