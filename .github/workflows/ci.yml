name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

      - name: Install workflowcheck
        run: go install go.temporal.io/sdk/contrib/tools/workflowcheck@latest

      - name: Run workflowcheck
        run: go vet -vettool=$(go env GOPATH)/bin/workflowcheck ./...

      # The end-to-end test in testcaller/ runs a dev server with the temporal CLI.
      - name: Install the Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Check generated code is up to date
        run: |
          make generate
          if ! git diff --quiet generated/; then
            echo "Generated code is out of date. Run 'make generate' and commit."
            git diff generated/
            exit 1
          fi
